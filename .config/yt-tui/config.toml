download_dir = "/home/eugene/Videos/yt-tui"
browser = "vivaldi+gnomekeyring"
youtube_enabled = true
max_concurrent_downloads = 3
sponsorblock = true
sponsorblock_categories = ["sponsor", "selfpromo", "interaction"]
audio_format = "mp3"
recommended_max_age_days = 7
recommended_min_duration_secs = 0
recommended_min_views = 0
recommended_fetch_count = 150
recommended_max_pages = 3
channel_latest_count = 3
channel_refresh_minutes = 60
channel_strikes = 2
enrichment_delay_seconds = 5
thumbnails_per_channel = 30
strip_emojis = true
subtitles = true
subtitle_langs = ["en", "ru"]
save_transcript = true
player = "mpv"
player_backend = "mpris"
hint_mode = "full"
duration_format = "hh:mm:ss"
transcript_width = "50%"
local_thumbnails = false
close_on_link_open = true
close_info_on_tab_switch = true
circular_nav = false
feed_mode = "recommended"
channels_view = "subscribed"
tags_mode = "subscribed"
hide_stale_tagged_channels = false
stale_tagged_channel_days = 30

[[panels]]
  name = "feed"
  type = "feed"
  mode = "recommended"
  sort = "date"

[[panels]]
  name = "channels"
  type = "channels"
  mode = "subscribed"
  sort = "date"

[[panels]]
  name = "tags"
  type = "tags"
  mode = "subscribed"

[[panels]]
  name = "playlists"
  type = "playlists"
  sort = "views"

[[panels]]
  name = "search"
  type = "search"

[[panels]]
  name = "downloading"
  type = "downloading"

[[panels]]
  name = "local"
  type = "local"
  sort = "views"

[[panels]]
  name = "history"
  type = "history"
  sort = "views"

[[panels]]
  name = "activity"
  type = "activity"

[keybindings]
  download = "d"
  download_audio = "D"
  delete = "x"
  play = "p"
  play_audio = "P"
  hide_video = "b"
  hide_channel = "B"
  copy_url = "y"
  open_links = "L"
  open_chapters = "C"
  open_transcript = "e"
  copy_transcript = "y"
  next_chapter = "]"
  prev_chapter = "["
  add_to_playlist = "a"
  new_playlist = "n"
  toggle_mode = "m"
  subscribe = "S"
  unsubscribe = "u"
  block = "X"
  rename_channel = "A"
  tag_channel = "T"
  panel_mode = "M"
  export = "E"
  import = "I"
  command_prompt = ":"
  help = "?"
  quit = "q"
  close = "esc"
  refresh = "r"
  force_refresh = "R"
  video_info = "i"
  focus_switch = "f"
  up = "k,up"
  down = "j,down"
  right = "l,right"
  page_up = "ctrl+u,pgup"
  page_down = "ctrl+d,pgdn"
  drill_down = "enter"
  back = "h,backspace,left"
  filter = "/"
  tab_chord = "t"
  sort_chord = "s"
  goto_prefix = "g"
  goto_bottom = "G"
  goto_line = "G"
  [keybindings.sort_keys]
    date = "d"
    views = "v"
    name = "n"
    channel = "c"
    duration = "D"
    subscribers = "s"
    tags = "t"
    size = "z"
  [keybindings.subscribe_keys]
    remote = "r"
    local = "l"
  [keybindings.playlist_keys]
    remote = "r"
    local = "l"
  [keybindings.tab_keys]
    a = "activity"
    c = "channels"
    d = "downloading"
    f = "feed"
    h = "history"
    l = "local"
    p = "playlists"
    s = "search"
    t = "tags"
