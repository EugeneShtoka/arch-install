download_dir = "/home/eugene/Videos/yt-tui"
browser = "vivaldi+gnomekeyring"
player = "mpv"
player_backend = "mpris"
max_concurrent_downloads = 3
sponsorblock = true
sponsorblock_categories = ["sponsor", "selfpromo", "interaction"]
audio_format = "mp3"
tabs = ["recommended", "subscriptions", "playlists", "search", "downloading", "local", "history"]
hint_mode = "full"
recommended_max_age_days = 7
recommended_fetch_count = 150
recommended_max_pages = 3
channel_latest_count = 3
channel_strikes = 2
subtitles = true
subtitle_langs = ["en.*"]

[keybindings]
  download = "d"
  download_audio = "D"
  delete = "x"
  play = "p"
  play_audio = "P"
  hide_video = "b"
  hide_channel = "B"
  copy_url = "c"
  watch_later = "w"
  add_to_playlist = "a"
  new_playlist = "n"
  toggle_mode = "m"
  subscribe = "S"
  unsubscribe = "u"
  help = "?"
  quit = "q"
  refresh = "r"
  force_refresh = "R"
  drill_down = "enter"
  back = "h,backspace"
  filter = "/"
  tab_chord = "t"
  sort_chord = "s"
  goto_prefix = "g"
  goto_bottom = "G"
  [keybindings.sort_keys]
    date = "d"
    views = "v"
    name = "n"
    channel = "c"
    duration = "D"
    subscribers = "s"
    saved = "a"
  [keybindings.tab_keys]
    recommended = "r"
    subscriptions = "s"
    playlists = "p"
    search = "S"
    downloading = "d"
    local = "l"
    history = "h"
