# iamb configuration — see iamb(5) and /usr/share/doc/iamb/config.example.toml
#
# Homeserver/account mirror ~/.config/kith/config.toml (tuwunel on the Hetzner
# VPS). matrix.cloud-surf.com serves no /.well-known/matrix/client, so `url`
# must stay set explicitly.

default_profile = "cloud-surf"

[profiles.cloud-surf]
user_id = "@eugene:matrix.cloud-surf.com"
url = "https://matrix.cloud-surf.com"

[settings]
username_display = "displayname"
message_user_color = true
user_gutter_width = 20
state_event_display = false      # hide join/leave spam from the bridges
reaction_display = true
read_receipt_send = true
read_receipt_display = true
typing_notice_send = true
typing_notice_display = true
normal_after_send = true
external_edit_file_suffix = ".md"
log_level = "warn"

[settings.notifications]
enabled = true
via = "desktop"
show_message = true

[settings.sort]
rooms = ["favorite", "lowpriority", "unread", "recent"]
members = ["power", "id"]

# wezterm renders sixel; font_size is width/height in pixels.
[settings.image_preview]
protocol.type = "sixel"
protocol.font_size = [8, 16]
size = { width = 80, height = 24 }

